<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MILES Car Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen phone app — header, filter, swipe deck, action bar; sheets slide over it.
   Look: MILES black/white with lime accent, condensed display type, mono labels. */
:root{
  --bg:#f1f1ee; --surface:#ffffff; --surface-2:#ecece8; --ink:#0b0b0b; --muted:#5f625c; --line:#d9d9d4;
  --accent:#c6f35f; --accent-ink:#0b0b0b; --solid:#0b0b0b; --on-solid:#ffffff; --photo:#ffffff;
  --like:#2f9e5b; --nope:#d84a3a; --shadow:0 18px 40px -20px rgba(0,0,0,.45);
  --display:"Barlow Condensed", "Archivo", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050505; --surface:#151515; --surface-2:#1f1f1f; --ink:#f3f3f0; --muted:#a3a59e; --line:#2c2c2c;
  --accent:#c6f35f; --accent-ink:#0b0b0b; --solid:#f3f3f0; --on-solid:#0b0b0b; --photo:#ffffff;
  --like:#4cc47c; --nope:#f06a5a; --shadow:0 18px 40px -20px rgba(0,0,0,.9); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#050505; --surface:#151515; --surface-2:#1f1f1f; --ink:#f3f3f0; --muted:#a3a59e; --line:#2c2c2c;
  --accent:#c6f35f; --accent-ink:#0b0b0b; --solid:#f3f3f0; --on-solid:#0b0b0b; --photo:#ffffff;
  --like:#4cc47c; --nope:#f06a5a; --shadow:0 18px 40px -20px rgba(0,0,0,.9); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.01em;line-height:1}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fav-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:600}
.fav-btn svg{width:18px;height:18px}
.count{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}

.filter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.filter button{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:8px 6px;font-family:var(--mono);font-size:13px}
.filter button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meta .num{font-variant-numeric:tabular-nums}

.deck{position:relative;flex:1;min-height:0;isolation:isolate;z-index:0}
.card{position:absolute;inset:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;touch-action:none;user-select:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.card.dragging{transition:none}
.pic{position:relative;flex:1;min-height:120px;background:var(--photo)}
.pic img{position:absolute;inset:8% 4%;width:92%;height:84%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.stamp{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:6px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;opacity:0;background:#fff}
.stamp.like{left:16px;color:var(--like);transform:rotate(-12deg)}
.stamp.nope{right:16px;color:var(--nope);transform:rotate(12deg)}
.pill{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;border-radius:4px;padding:3px 8px;background:var(--accent);color:var(--accent-ink)}
.pill.later{background:#e9e9e4;color:#333}
.photo-count{position:absolute;right:12px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-family:var(--mono);font-size:11px;border-radius:4px;padding:3px 8px}
.info{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title-row>div{min-width:0}
.title-row h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;text-wrap:balance}
.title-row small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:4px}
.info-btn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-family:var(--mono)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-family:var(--mono);font-size:11px;border-radius:4px;padding:4px 8px;border:1px solid var(--ink)}
.badge.share{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.badge.abo{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.specs div{min-width:0}
.specs dt{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.specs dd{margin:2px 0 0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.specs .wide{grid-column:1/-1}

.actions{display:flex;justify-content:center;align-items:center;gap:18px;padding-bottom:max(4px, env(safe-area-inset-bottom,0px))}
.act{border:1px solid var(--line);background:var(--surface);border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.act:active{transform:scale(.92)}
.act.small{width:48px;height:48px}.act.big{width:64px;height:64px}
.act svg{width:24px;height:24px}
.act.nope{color:var(--nope)} .act.like{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act:disabled{opacity:.4;cursor:default}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--surface);border-radius:14px;border:1px dashed var(--line)}
.empty h2{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;font-size:32px;line-height:1}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid transparent;border-radius:6px;padding:11px 14px;font-weight:600;text-align:center}
.btn.primary{background:var(--solid);color:var(--on-solid)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(440px,100%);max-height:92%;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  background:var(--surface);border-radius:16px 16px 0 0;z-index:6;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;scrollbar-width:none;background:var(--photo)}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{flex:0 0 100%;width:100%;margin:0;scroll-snap-align:start;aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden}
.gallery img{position:absolute;top:6%;left:5%;width:90%;height:88%;max-width:none;object-fit:contain;display:block}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li::before{content:"▸ ";color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:0;font-family:var(--mono)}

.fav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fav-item{display:grid;grid-template-columns:96px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;align-items:start}
.thumb{width:96px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--photo);max-width:100%;position:relative}
.thumb img{position:absolute;top:6%;left:5%;width:90%;height:88%;max-width:none;object-fit:contain;display:block}
.fav-item h4{margin:0;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.fav-item p{margin:4px 0 8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.fav-item .row .btn{padding:7px 10px;font-size:13px}
.fav-item>div{min-width:0}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--solid);color:var(--on-solid);
  padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:10;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-height:640px){.title-row h2{font-size:24px}.info{gap:7px;padding:10px 14px 12px}.specs dd{font-size:13px}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>MILES</b><span>Car Match</span></div>
    <button class="fav-btn" id="openFavs" aria-label="Favoriten öffnen">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.5 1 5 2.8 1.5-1.8 3-2.8 5-2.8 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>
      Favoriten <span class="count" id="favCount">0</span>
    </button>
  </header>

  <div class="filter" role="group" aria-label="Verfügbarkeit filtern">
    <button data-f="all" aria-pressed="true">Alle</button>
    <button data-f="sharing" aria-pressed="false">CarSharing</button>
    <button data-f="abo" aria-pressed="false">Abo</button>
  </div>
  <div class="meta"><span>Berlin · Stand 15.10.2026</span><span class="num" id="progress">1 / 1</span></div>

  <div class="deck" id="deck" aria-live="polite"></div>

  <div class="actions">
    <button class="act small" id="undoBtn" aria-label="Rückgängig" title="Rückgängig (Backspace)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="act big nope" id="nopeBtn" aria-label="Nicht interessant" title="Nicht interessant (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="act big like" id="likeBtn" aria-label="Gefällt mir" title="Gefällt mir (→)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.5 1 5 2.8 1.5-1.8 3-2.8 5-2.8 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </button>
    <button class="act small" id="infoBtn" aria-label="Details anzeigen" title="Details (Leertaste)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="sheet-head"><h3 id="dTitle">Details</h3><button class="x" data-close aria-label="Schließen">✕</button></div>
  <div class="sheet-body" id="dBody"></div>
</section>
<section class="sheet" id="favs" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="sheet-head"><h3 id="fTitle">Deine Favoriten</h3><button class="x" data-close aria-label="Schließen">✕</button></div>
  <div class="sheet-body" id="fBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

];

const AV_LABEL = { sharing:"CarSharing", abo:"Abo" };

/* ---------- storage (optional, per viewer) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let favorites = store.get("miles.favs2", []).filter(id=>CARS.some(c=>c.id===id));
let filter = store.get("miles.filter", "all");
let decided = [];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const byId = id => CARS.find(c=>c.id===id);
const matches = c => filter==="all" || c.availability.includes(filter);
const imgs = c => c.images.map(k=>IMG[k]).filter(Boolean);
const imgTag = (src, c) => `<img src="${src}" alt="${c.make} ${c.model}" draggable="false">`;
const badges = c => c.availability.map(a=>`<span class="badge ${a==="sharing"?"share":"abo"}">${AV_LABEL[a]}</span>`).join("");
function specs(c, full){
  const rows = [["Kraftstoff", c.fuel]];
  rows.push(c.power ? ["Leistung", c.power] : ["Sitze / Getriebe", c.seats]);
  if (c.color) rows.push(["Farbe", c.color]); else rows.push(["Kategorie", c.variant]);
  rows.push(["Highlight", c.feature]);
  const price = [];
  if (c.sharingPrice) price.push(`CarSharing ${c.sharingPrice}`);
  if (c.aboPrice) price.push(`Abo ${c.aboPrice}`);
  return `<dl class="specs">${rows.map(([l,v])=>`<div><dt>${l}</dt><dd>${v}</dd></div>`).join("")}
    <div class="wide"><dt>Preis</dt><dd>${price.join(" · ")}</dd></div>
    ${full && c.seats && c.power ? `<div class="wide"><dt>Sitze / Getriebe</dt><dd>${c.seats}</dd></div>`:""}</dl>`;
}
function ctas(c, compact){
  return c.availability.map(a => a==="sharing"
    ? `<a class="btn primary" href="${FLEET_URL}" target="_blank" rel="noopener">${compact?"Mieten":"In der App mieten"}</a>`
    : `<a class="btn accent" href="${ABO_URL}${c.abo}" target="_blank" rel="noopener">${compact?"Abo ansehen":"Abo ansehen"}</a>`).join("");
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2000); }
function saveFavs(){ store.set("miles.favs2", favorites); $("#favCount").textContent = favorites.length; }

/* ---------- deck ---------- */
function queue(){ const done = new Set(decided.map(d=>d.id)); return CARS.filter(c=>matches(c) && !done.has(c.id)); }
function render(){
  const deck = $("#deck"), q = queue(), total = CARS.filter(matches).length;
  deck.innerHTML = "";
  $("#progress").textContent = q.length ? `${total-q.length+1} / ${total}` : `${total} / ${total}`;
  $("#undoBtn").disabled = !decided.length;
  $("#nopeBtn").disabled = $("#likeBtn").disabled = $("#infoBtn").disabled = !q.length;
  if (!q.length){
    deck.innerHTML = `<div class="empty"><h2>Alle Autos gesehen</h2>
      <p>${favorites.length ? `${favorites.length} ${favorites.length===1?"Auto":"Autos"} in deinen Favoriten.` : "Noch keine Favoriten – schau dir die Flotte nochmal an."}</p>
      <div class="row"><button class="btn primary" id="restart">Von vorne starten</button>${favorites.length?`<button class="btn ghost" id="goFavs">Favoriten ansehen</button>`:""}</div></div>`;
    $("#restart").onclick = ()=>{ decided = decided.filter(d=>!matches(byId(d.id))); render(); };
    const gf = $("#goFavs"); if (gf) gf.onclick = openFavs;
    return;
  }
  q.slice(0,3).reverse().forEach((c, i, arr)=>{
    const depth = arr.length-1-i;
    const el = document.createElement("article");
    el.className = "card"; el.dataset.id = c.id;
    el.style.transform = `translateY(${depth*10}px) scale(${1-depth*0.04})`;
    el.style.zIndex = 10-depth;
    if (depth) el.setAttribute("aria-hidden","true");
    const ph = imgs(c);
    const statusPill = c.status ? `<span class="pill ${/sofort/.test(c.status)?"":"later"}">${c.status}</span>` : "";
    el.innerHTML = `<div class="pic">${ph[0]?imgTag(ph[0],c):""}<span class="stamp like">LIKE</span><span class="stamp nope">NOPE</span>${statusPill}${ph.length>1?`<span class="photo-count">${ph.length} Fotos</span>`:""}</div>
      <div class="info">
        <div class="title-row"><div><h2>${c.make} ${c.model}</h2><small>${c.variant}</small></div>
          <button class="info-btn" data-info aria-label="Details zu ${c.make} ${c.model}">i</button></div>
        <div class="badges">${badges(c)}</div>
        ${specs(c)}
      </div>`;
    deck.appendChild(el);
    if (!depth) bindDrag(el, c);
  });
}
function bindDrag(el, car){
  let sx=0, sy=0, dx=0, dy=0, t0=0, active=false;
  const like = el.querySelector(".stamp.like"), nope = el.querySelector(".stamp.nope");
  el.addEventListener("pointerdown", e=>{
    if (e.target.closest("[data-info]")) return;
    active=true; sx=e.clientX; sy=e.clientY; dx=dy=0; t0=performance.now();
    el.setPointerCapture(e.pointerId); el.classList.add("dragging");
  });
  el.addEventListener("pointermove", e=>{
    if(!active) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    el.style.transform = `translate(${dx}px,${dy*0.3}px) rotate(${dx/18}deg)`;
    like.style.opacity = Math.max(0, Math.min(1, dx/90));
    nope.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = ()=>{
    if(!active) return; active=false; el.classList.remove("dragging");
    const v = Math.abs(dx)/Math.max(1, performance.now()-t0);
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6){ el.style.transform=""; openDetail(car.id); return; }
    if (Math.abs(dx) > 90 || (v > 0.6 && Math.abs(dx) > 30)) decide(dx>0 ? "like" : "nope");
    else { el.style.transform=""; like.style.opacity=nope.style.opacity=0; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.querySelector("[data-info]").addEventListener("click", ()=>openDetail(car.id));
}
function decide(action){
  const top = $("#deck .card:last-child"); if(!top) return;
  const id = top.dataset.id, car = byId(id);
  top.querySelector(`.stamp.${action}`).style.opacity = 1;
  top.style.transform = `translate(${action==="like"?560:-560}px,40px) rotate(${action==="like"?24:-24}deg)`;
  top.style.opacity = 0;
  decided.push({id, action});
  if (action==="like" && !favorites.includes(id)){ favorites.push(id); saveFavs(); toast(`${car.make} ${car.model} gemerkt`); }
  setTimeout(render, 260);
}
function undo(){
  const last = decided.pop(); if(!last) return;
  if (last.action==="like"){ favorites = favorites.filter(f=>f!==last.id); saveFavs(); }
  if (!matches(byId(last.id))){ filter="all"; syncFilter(); }
  render();
}

/* ---------- sheets ---------- */
function openSheet(id){ $("#scrim").classList.add("on"); $(id).classList.add("on"); $(id).querySelector("[data-close]").focus(); }
function closeSheets(){ $("#scrim").classList.remove("on"); document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on")); }
function openDetail(id){
  const c = byId(id), ph = imgs(c);
  $("#dTitle").textContent = `${c.make} ${c.model}`;
  $("#dBody").innerHTML = `
    <div class="gallery" id="gal">${ph.map(p=>`<figure>${imgTag(p,c)}</figure>`).join("")}</div>
    ${ph.length>1?`<div class="dots" id="dots">${ph.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}
    <p class="note">${c.variant}${c.status?` · ${c.status}`:""}</p>
    <div class="badges">${badges(c)}</div>
    ${specs(c, true)}
    ${c.checks?`<ul class="checks">${c.checks.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    <div class="row">${ctas(c)}</div>
    <p class="note">Angaben von miles-mobility.com, Stand 15.10.2026. Preise können sich ändern.</p>`;
  const gal = $("#gal");
  gal.addEventListener("scroll", ()=>{ const i=Math.round(gal.scrollLeft/gal.clientWidth); document.querySelectorAll("#dots i").forEach((d,j)=>d.classList.toggle("on", j===i)); });
  if (!$("#detail").classList.contains("on")){ closeSheets(); openSheet("#detail"); }
}
function openFavs(){
  const body = $("#fBody");
  body.innerHTML = !favorites.length
    ? `<p class="note" style="font-size:14px">Noch keine Favoriten. Wische ein Auto nach rechts oder tippe auf das Herz.</p>`
    : `<ul class="fav-list">${favorites.map(id=>{ const c=byId(id); if(!c) return ""; const p=imgs(c)[0];
      return `<li class="fav-item"><div class="thumb">${p?imgTag(p,c):""}</div><div>
        <h4>${c.make} ${c.model}</h4><p>${c.fuel}${c.power?` · ${c.power}`:""} · ${c.aboPrice||c.sharingPrice}</p>
        <div class="row">${ctas(c,true)}<button class="btn ghost" data-remove="${c.id}" aria-label="${c.make} ${c.model} entfernen">Entfernen</button></div>
      </div></li>`; }).join("")}</ul>`;
  closeSheets(); openSheet("#favs");
}

/* ---------- filter & events ---------- */
function syncFilter(){ document.querySelectorAll(".filter button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.f===filter)); store.set("miles.filter", filter); }
document.querySelectorAll(".filter button").forEach(b=>b.addEventListener("click", ()=>{ filter=b.dataset.f; syncFilter(); render(); }));
$("#likeBtn").onclick = ()=>decide("like");
$("#nopeBtn").onclick = ()=>decide("nope");
$("#undoBtn").onclick = undo;
$("#infoBtn").onclick = ()=>{ const t=$("#deck .card:last-child"); if(t) openDetail(t.dataset.id); };
$("#openFavs").onclick = openFavs;
$("#scrim").onclick = closeSheets;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
document.addEventListener("click", e=>{
  const rm = e.target.closest("[data-remove]");
  if (rm){ favorites = favorites.filter(f=>f!==rm.dataset.remove); saveFavs(); openFavs(); }
});
document.addEventListener("keydown", e=>{
  const sheetOpen = document.querySelector(".sheet.on");
  if (e.key==="Escape" && sheetOpen) return closeSheets();
  if (sheetOpen) return;
  if (e.key==="ArrowRight") decide("like");
  else if (e.key==="ArrowLeft") decide("nope");
  else if (e.key==="Backspace"){ e.preventDefault(); undo(); }
  else if (e.key===" "){ e.preventDefault(); $("#infoBtn").click(); }
});
syncFilter(); saveFavs(); render();
</script>
